name: 🤖 RBRU Schedule Auto-Sync

on:
  schedule:
    # รันตอนตี 2 ของทุกวัน (เวลาไทยคือ UTC+7, ดังนั้นใน cron ให้ตั้ง 19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      semester:
        description: "ภาคเรียน (เว้นว่างเพื่อใช้ภาคเรียนปัจจุบันของ REG)"
        required: false
        type: string
        default: ""

permissions:
  contents: write # สิทธิ์ให้ Workflow นี้สามารถ Commit ไฟล์กลับเข้าโปรเจกต์ได้

jobs:
  run-bot-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Verify schedule parser
        run: |
          python -m unittest discover -s scripts -p 'test_schedule_sync.py' -v
          node scripts/test_schedule_source.cjs

      - name: 🚀 Run Schedule Bot
        env:
          RBRU_USERNAME: ${{ secrets.RBRU_USERNAME }}
          RBRU_PASSWORD: ${{ secrets.RBRU_PASSWORD }}
          RBRU_HEADLESS: "true"
          RBRU_SEMESTER: ${{ inputs.semester }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/update_schedule_bot.py

      - name: 💾 Commit and Push Changes (schedule.json)
        env:
          SCHEDULE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "Validated schedule is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Auto-update teaching schedule"
          git pull --rebase origin "$SCHEDULE_BRANCH"
          git push origin "HEAD:$SCHEDULE_BRANCH"
          echo "Updated schedule.json on $SCHEDULE_BRANCH." >> "$GITHUB_STEP_SUMMARY"
